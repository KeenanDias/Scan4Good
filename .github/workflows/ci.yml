name: Scan4Good CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # JOB 1: BACKEND
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' 
        distribution: 'temurin'
        cache: maven

    - name: Build and Test Backend
      run: mvn -B package --file pom.xml

  # JOB 2: FRONTEND (Angular & Node)
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/scan4good-frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' 
        cache: 'npm'
        cache-dependency-path: ./frontend/scan4good-frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm run test -- --watch=false

    - name: Build Frontend
      run: npm run build
